mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoDistMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/nmpc_controller/hydrus/hydrus_nmpc

controller:
  alloc:
    type: 1    # 0: pseudo allocation, 1: heuristic allocation,
    ft_thresh: 1.0  # N

  nmpc:
    T_samp: 0.01    # 100 Hz  TODO: should be adjusted by main_rate
    T_horizon: 0.5  # in seconds
    T_step: 0.01     # in seconds

    # constraint
    w_max: 6  # 1 rad/s ~ 57 deg/s
    w_min: -6

    v_max: 5
    v_min: -5

    j_max: 1.5708
    j_min: -1.5708

    thrust_max: 30 # N
    thrust_min: 0 # N

    a_max: 3.92699  # 180 + 45 degree ~ 0.5
    a_min: -3.92699

    # params for the cost function
    Qp_xy: 600
    Qp_z: 600
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 200
    Qq_z: 600
    Qw_xy: 10
    Qw_z: 10
    Qj: 100
    Qa: 2
    Rt: 0.2
    Rac_d: 250  # difference of ac

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: false
    is_debug: false
